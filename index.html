
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talkers</title>
<style>
*{box-sizing:border-box}
:root{--bg:#313338;--side:#2b2d31;--dark:#1e1f22;--accent:#7657e8;--text:#f2f3f5;--muted:#949ba4}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
button,input{font:inherit}
button{border:0;border-radius:6px;padding:8px 12px;color:white;background:var(--accent);cursor:pointer}
button:hover{filter:brightness(1.13)}
button:disabled{opacity:.4;cursor:default}
input{outline:none}
.servers{width:68px;min-width:68px;background:var(--dark);padding:12px 9px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow-y:auto}
.server{width:46px;height:46px;min-height:46px;border-radius:16px;background:#313338;display:grid;place-items:center;font-size:18px;font-weight:bold;cursor:pointer;overflow:hidden;position:relative}
.server.active{background:var(--accent);border-radius:13px}
.server:hover{border-radius:13px}
.server img{width:100%;height:100%;object-fit:cover}
.add-server{font-size:26px;color:#3ba55c}
.channels{width:225px;min-width:170px;background:var(--side);padding:15px 10px;display:flex;flex-direction:column;overflow-y:auto}
.brand{font-size:25px;font-weight:bold;color:#b7a5ff;padding:5px 8px 20px}
.server-heading{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:10px 7px;border-bottom:1px solid #404249;font-weight:bold;overflow-wrap:anywhere}
.server-heading span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.small-btn{background:transparent;color:#b5bac1;padding:5px 8px;font-size:17px}
.small-btn:hover{background:#404249}
.section{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:bold;margin:20px 5px 8px}
.channel{display:flex;align-items:center;gap:7px;padding:9px 8px;color:#b5bac1;border-radius:5px;cursor:pointer;margin:2px 0;min-width:0}
.channel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.channel:hover,.channel.active{background:#404249;color:white}
.channel-tools{display:none;gap:2px}
.channel:hover .channel-tools,.channel.active .channel-tools{display:flex}
.channel-tools button{font-size:12px;padding:3px 5px;background:transparent;color:#b5bac1}
.channel-tools button:hover{background:#555861}
.profile{margin-top:auto;padding:9px 5px;border-radius:8px;display:flex;align-items:center;gap:9px;cursor:pointer;overflow:hidden}
.profile:hover{background:#404249}
.avatar{width:36px;height:36px;min-width:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:bold;overflow:hidden;color:white}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{min-width:0;overflow:hidden;flex:1}
.profile-name{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.profile-status{font-size:11px;color:#3ba55c;margin-top:4px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;min-height:58px;padding:0 16px;border-bottom:1px solid #26272b;display:flex;align-items:center;gap:10px}
.topbar-title{font-weight:bold;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;gap:5px}
.top-actions button{font-size:12px;padding:7px}
.messages{flex:1;overflow-y:auto;padding:20px}
.welcome{margin-top:25px;margin-bottom:30px}
.welcome h1{font-size:27px}
.welcome p{color:#b5bac1;line-height:1.5}
.message{margin:19px 0;line-height:1.5;overflow-wrap:anywhere}
.message-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.message-head .avatar{width:32px;height:32px;min-width:32px;font-size:12px}
.username{font-weight:bold}
.time{font-size:11px;color:var(--muted)}
.message-text{margin-left:40px;white-space:pre-wrap;overflow-wrap:anywhere}
.message-actions{margin-left:40px;display:flex;gap:5px;margin-top:5px}
.message-actions button{font-size:11px;padding:4px 7px;background:#404249;color:#dbdee1}
.composer{padding:0 20px 20px}
.composer form{display:flex;background:#383a40;border-radius:9px;padding:6px;gap:6px}
.composer input{flex:1;min-width:0;border:0;padding:12px;color:white;background:transparent;font-size:15px}
.composer input::placeholder{color:#949ba4}
.members{width:185px;min-width:150px;background:var(--side);padding:20px 12px;overflow-y:auto}
.member{color:#b5bac1;padding:9px 4px;font-size:14px;overflow-wrap:anywhere}
.dot{color:#3ba55c;margin-right:7px}
.empty{color:#949ba4;text-align:center;padding:30px 10px;line-height:1.6}
.modal-overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:#2b2d31;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:24px;border-radius:14px;box-shadow:0 15px 50px #0008}
.modal h2{margin-top:0}
.modal p{color:#b5bac1;font-size:14px;line-height:1.5}
.modal label{display:block;margin:18px 0 7px;color:#dbdee1;font-size:14px}
.modal input[type=text],.modal input[type=password]{width:100%;padding:12px;border:1px solid #404249;border-radius:7px;background:#1e1f22;color:white;font-size:15px}
.modal input[type=color]{width:60px;height:40px;cursor:pointer;border:none;background:transparent}
.modal input[type=file]{width:100%;color:#b5bac1;font-size:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px;flex-wrap:wrap}
.cancel-btn{background:#404249}
.danger-btn{background:#b33c46}
.hidden{display:none!important}
@media(max-width:850px){.members{display:none}}
@media(max-width:560px){.channels{width:155px;min-width:135px;padding:10px 6px}.servers{width:52px;min-width:52px;padding:10px 5px}.server{width:40px;height:40px;min-height:40px}.messages{padding:12px}.composer{padding:0 10px 12px}.topbar{padding:0 9px}.top-actions button{font-size:10px;padding:6px 5px}.welcome h1{font-size:22px}.brand{font-size:22px}}
</style>
</head>
<body>

<aside class="servers" id="serversList"></aside>

<aside class="channels">
  <div class="brand">talkers.</div>
  <div class="server-heading">
    <span id="currentServerName">My Server</span>
    <button class="small-btn" id="serverMenu" title="Server settings">⚙</button>
  </div>
  <div class="section">
    <span>TEXT CHANNELS</span>
    <button class="small-btn" id="addChannel" title="Create channel">+</button>
  </div>
  <div id="channelsList"></div>
  <div class="section"><span>VOICE CHANNELS</span></div>
  <div class="channel" id="voiceChannel">🔊 <span>Hangout</span></div>
  <div class="profile" id="profileButton" title="Edit profile">
    <div class="avatar" id="sidebarAvatar">Y</div>
    <div class="profile-info">
      <div class="profile-name" id="sidebarName">You</div>
      <div class="profile-status">● Online</div>
    </div>
    <span>⚙</span>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="topbar-title" id="channelTitle"># general</div>
    <div class="top-actions">
      <button id="renameChannel" title="Rename channel">✎ Rename</button>
      <button id="deleteChannel" class="danger-btn" title="Delete channel">Delete</button>
    </div>
  </header>
  <section class="messages" id="messages"></section>
  <div class="composer">
    <form id="chatForm">
      <input id="messageInput" placeholder="Message..." maxlength="2000" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>
</main>

<aside class="members">
  <div class="section" id="membersHeading">MEMBERS — 1</div>
  <div class="member"><span class="dot">●</span><span id="memberName">You</span></div>
</aside>

<div class="modal-overlay" id="profileOverlay">
  <div class="modal">
    <h2>Profile Settings</h2>
    <p>Personalize your Talkers profile.</p>
    <label>Profile picture</label>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="avatar" id="previewAvatar" style="width:64px;height:64px;min-width:64px;font-size:22px">Y</div>
      <input type="file" id="avatarUpload" accept="image/*">
    </div>
    <button type="button" class="cancel-btn" id="removePicture" style="margin-top:10px">Remove picture</button>
    <label for="usernameInput">Username</label>
    <input type="text" id="usernameInput" maxlength="24" placeholder="Your name">
    <label for="colorInput">Profile color</label>
    <input type="color" id="colorInput" value="#7657e8">
    <div class="modal-actions">
      <button type="button" class="cancel-btn" data-close="profileOverlay">Cancel</button>
      <button type="button" id="saveProfile">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="serverOverlay">
  <div class="modal">
    <h2>Server Settings</h2>
    <p>Change your server name or manage your server.</p>
    <label for="serverNameInput">Server name</label>
    <input type="text" id="serverNameInput" maxlength="40">
    <div class="modal-actions" style="justify-content:space-between">
      <button type="button" class="danger-btn" id="deleteServer">Delete Server</button>
      <div style="display:flex;gap:8px">
        <button type="button" class="cancel-btn" data-close="serverOverlay">Cancel</button>
        <button type="button" id="saveServer">Save</button>
      </div>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = window.supabase.createClient(
  "https://jzmytquuzdcwpoxuwkkr.supabase.co",
  "sb_publishable_yZW4WRtRb-9LGVN65riM8g_JqgiLH-Z"
);
const $ = id => document.getElementById(id);
const STORAGE_KEY = "talkersAppV3";
let liveChat = null;

function connectLiveChat() {
  liveChat = supabaseClient.channel("talkers-shared-room", {
    config: {
      private: false,
      broadcast: { self: false }
    }
  });

  liveChat.on("broadcast", { event: "talker-message" }, ({ payload }) => {
    if (!payload || !payload.id || typeof payload.text !== "string") return;

    let server = data.servers.find(s => s.name === payload.serverName);

    if (!server) {
      server = {
        id: uid(),
        name: cleanName(payload.serverName) || "My Server",
        channels: []
      };
      data.servers.push(server);
    }

    let channel = server.channels.find(c => c.name === payload.channelName);

    if (!channel) {
      channel = {
        id: uid(),
        name: cleanName(payload.channelName, 30) || "general",
        messages: []
      };
      server.channels.push(channel);
    }

    if (channel.messages.some(m => m.id === payload.id)) return;

    channel.messages.push({
      ...payload,
      owner: "remote"
    });

    if (channel.messages.length > 500) channel.messages.shift();

    saveData();
    renderAll();
  });

  liveChat.subscribe(status => {
    if (status === "SUBSCRIBED") {
      console.log("Talkers live chat connected!");
    }
  });
}
function uid(){
  return Math.random().toString(36).slice(2,9)+Date.now().toString(36);
}

function cleanName(value,max=40){
  return String(value||"").trim().slice(0,max);
}

function makeDefaultData(){
  const serverId=uid();
  const channelId=uid();
  return {
    profile:{name:"You",color:"#7657e8",picture:""},
    servers:[{
      id:serverId,name:"My Server",
      channels:[{id:channelId,name:"general",messages:[]}]
    }],
    activeServerId:serverId,
    activeChannelId:channelId
  };
}

let data=makeDefaultData();

function loadData(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(!saved || !Array.isArray(saved.servers) || !saved.servers.length) return;

    if(saved.profile && typeof saved.profile==="object"){
      if(typeof saved.profile.name==="string" && saved.profile.name.trim())
        data.profile.name=saved.profile.name.slice(0,24);
      if(typeof saved.profile.color==="string" && /^#[0-9a-fA-F]{6}$/.test(saved.profile.color))
        data.profile.color=saved.profile.color;
      if(typeof saved.profile.picture==="string" &&
        saved.profile.picture.startsWith("data:image/") &&
        saved.profile.picture.length<3000000)
        data.profile.picture=saved.profile.picture;
    }

    data.servers=saved.servers
      .filter(s=>s && typeof s.id==="string")
      .map(s=>({
        id:s.id,
        name:cleanName(s.name)||"My Server",
        channels:Array.isArray(s.channels)?s.channels
          .filter(c=>c && typeof c.id==="string")
          .map(c=>({
            id:c.id,
            name:cleanName(c.name,30)||"general",
            messages:Array.isArray(c.messages)?c.messages
              .filter(m=>m && typeof m.text==="string")
              .slice(-500)
              .map(m=>({
                id:typeof m.id==="string"?m.id:uid(),
                name:cleanName(m.name,24)||"You",
                color:typeof m.color==="string"&&/^#[0-9a-fA-F]{6}$/.test(m.color)?m.color:"#7657e8",
                picture:typeof m.picture==="string"&&m.picture.startsWith("data:image/")?m.picture:"",
                time:typeof m.time==="string"?m.time:"",
                text:m.text.slice(0,2000),
                edited:!!m.edited
              })): []
          })):[],
      }));

    if(!data.servers.length) data=makeDefaultData();

    data.activeServerId=data.servers.some(s=>s.id===saved.activeServerId)
      ?saved.activeServerId:data.servers[0].id;

    const server=data.servers.find(s=>s.id===data.activeServerId);
    data.activeChannelId=server.channels.some(c=>c.id===saved.activeChannelId)
      ?saved.activeChannelId:(server.channels[0]?.id||"");
  }catch(e){
    console.warn("Could not load Talkers data",e);
  }
}

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
    return true;
  }catch(e){
    alert("Couldn't save. Your browser storage may be full. Try using a smaller profile picture or deleting old messages.");
    return false;
  }
}

function activeServer(){
  return data.servers.find(s=>s.id===data.activeServerId);
}

function activeChannel(){
  const server=activeServer();
  return server?.channels.find(c=>c.id===data.activeChannelId)||null;
}

function avatar(element,person){
  element.replaceChildren();
  if(person.picture){
    const img=document.createElement("img");
    img.src=person.picture;
    img.alt="Profile picture";
    element.appendChild(img);
  }else{
    element.textContent=(person.name.trim()[0]||"?").toUpperCase();
  }
  element.style.background=person.color||"#7657e8";
}

function renderServers(){
  const list=$("serversList");
  list.replaceChildren();

  data.servers.forEach(server=>{
    const btn=document.createElement("div");
    btn.className="server"+(server.id===data.activeServerId?" active":"");
    btn.title=server.name;
    btn.textContent=(server.name[0]||"S").toUpperCase();
    btn.addEventListener("click",()=>{
      data.activeServerId=server.id;
      if(!server.channels.some(c=>c.id===data.activeChannelId))
        data.activeChannelId=server.channels[0]?.id||"";
      saveData();
      renderAll();
    });
    list.appendChild(btn);
  });

  const add=document.createElement("div");
  add.className="server add-server";
  add.title="Create server";
  add.textContent="+";
  add.addEventListener("click",createServer);
  list.appendChild(add);
}

function renderChannels(){
  const server=activeServer();
  $("currentServerName").textContent=server.name;
  const list=$("channelsList");
  list.replaceChildren();

  server.channels.forEach(channel=>{
    const row=document.createElement("div");
    row.className="channel"+(channel.id===data.activeChannelId?" active":"");

    const hash=document.createElement("span");
    hash.style.flex="0 0 auto";
    hash.textContent="#";

    const name=document.createElement("span");
    name.textContent=channel.name;
    name.title=channel.name;
    name.addEventListener("click",()=>selectChannel(channel.id));

    const tools=document.createElement("div");
    tools.className="channel-tools";

    const rename=document.createElement("button");
    rename.textContent="✎";
    rename.title="Rename channel";
    rename.addEventListener("click",e=>{
      e.stopPropagation();
      renameChannel(channel);
    });

    const remove=document.createElement("button");
    remove.textContent="×";
    remove.title="Delete channel";
    remove.addEventListener("click",e=>{
      e.stopPropagation();
      removeChannel(channel);
    });

    tools.append(rename,remove);
    row.append(hash,name,tools);
    row.addEventListener("click",()=>selectChannel(channel.id));
    list.appendChild(row);
  });
}

function renderMessages(){
  const channel=activeChannel();
  const server=activeServer();
  const list=$("messages");
  list.replaceChildren();

  if(!channel){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="Create a channel to start chatting.";
    list.appendChild(empty);
    $("channelTitle").textContent="No channel";
    $("messageInput").placeholder="Create a channel first...";
    $("messageInput").disabled=true;
    $("chatForm").querySelector("button").disabled=true;
    $("renameChannel").disabled=true;
    $("deleteChannel").disabled=true;
    return;
  }

  $("messageInput").disabled=false;
  $("chatForm").querySelector("button").disabled=false;
  $("renameChannel").disabled=false;
  $("deleteChannel").disabled=server.channels.length<=1;
  $("channelTitle").textContent="# "+channel.name;
  $("messageInput").placeholder="Message #"+channel.name+"...";

  if(!channel.messages.length){
    const welcome=document.createElement("div");
    welcome.className="welcome";
    const h=document.createElement("h1");
    h.textContent = "Welcome to #" + channel.name;
    const p=document.createElement("p");
    p.textContent="This is the beginning of this channel. Send a message!";
    welcome.append(h,p);
    list.appendChild(welcome);
  }

  channel.messages.forEach(message=>{
    const wrap=document.createElement("div");
    wrap.className="message";

    const head=document.createElement("div");
    head.className="message-head";

    const pic=document.createElement("div");
    pic.className="avatar";
    avatar(pic,message);

    const name=document.createElement("span");
    name.className="username";
    name.style.color=message.color;
    name.textContent=message.name;

    const time=document.createElement("span");
    time.className="time";
    time.textContent=message.time+(message.edited?" (edited)":"");

    head.append(pic,name,time);

    const content=document.createElement("div");
    content.className="message-text";
    content.textContent=message.text;

    wrap.append(head,content);

    if(message.owner==="local"){
      const actions=document.createElement("div");
      actions.className="message-actions";

      const edit=document.createElement("button");
      edit.textContent="✎ Edit";
      edit.addEventListener("click",()=>editMessage(channel,message));

      const del=document.createElement("button");
      del.textContent="🗑 Delete";
      del.addEventListener("click",()=>deleteMessage(channel,message));

      actions.append(edit,del);
      wrap.appendChild(actions);
    }

    list.appendChild(wrap);
  });

  list.scrollTop=list.scrollHeight;
}

function renderAll(){
  renderServers();
  renderChannels();
  renderMessages();
  $("sidebarName").textContent=data.profile.name;
  $("memberName").textContent=data.profile.name;
  $("membersHeading").textContent="MEMBERS — 1";
  avatar($("sidebarAvatar"),data.profile);
}

function selectChannel(id){
  data.activeChannelId=id;
  saveData();
  renderChannels();
  renderMessages();
}

function createServer(){
  const name=cleanName(prompt("What should your new server be called?"));
  if(!name)return;

  const server={
    id:uid(),
    name,
    channels:[{id:uid(),name:"general",messages:[]}]
  };

  data.servers.push(server);
  data.activeServerId=server.id;
  data.activeChannelId=server.channels[0].id;
  saveData();
  renderAll();
}

$("serverMenu").addEventListener("click",()=>{
  $("serverNameInput").value=activeServer().name;
  $("serverOverlay").classList.add("open");
});

$("saveServer").addEventListener("click",()=>{
  const name=cleanName($("serverNameInput").value);
  if(!name){alert("Enter a server name.");return;}
  activeServer().name=name;
  saveData();
  $("serverOverlay").classList.remove("open");
  renderAll();
});

$("deleteServer").addEventListener("click",()=>{
  if(data.servers.length<=1){
    alert("You must keep at least one server.");
    return;
  }
  const server=activeServer();
  if(!confirm('Delete "'+server.name+'" and all its channels and messages?'))return;

  data.servers=data.servers.filter(s=>s.id!==server.id);
  data.activeServerId=data.servers[0].id;
  data.activeChannelId=data.servers[0].channels[0]?.id||"";
  saveData();
  $("serverOverlay").classList.remove("open");
  renderAll();
});

$("addChannel").addEventListener("click",()=>{
  const name=cleanName(prompt("Enter a channel name (without #)."),30)
    .replace(/^#+/,"");
  if(!name)return;

  const server=activeServer();
  if(server.channels.some(c=>c.name.toLowerCase()===name.toLowerCase())){
    alert("A channel with that name already exists.");
    return;
  }

  const channel={id:uid(),name,messages:[]};
  server.channels.push(channel);
  data.activeChannelId=channel.id;
  saveData();
  renderAll();
});

function renameChannel(channel){
  const name=cleanName(prompt("New channel name:",channel.name),30)
    .replace(/^#+/,"");
  if(!name)return;

  if(activeServer().channels.some(c=>c.id!==channel.id&&c.name.toLowerCase()===name.toLowerCase())){
    alert("A channel with that name already exists.");
    return;
  }

  channel.name=name;
  saveData();
  renderAll();
}

function removeChannel(channel){
  const server=activeServer();
  if(server.channels.length<=1){
    alert("Every server must have at least one channel.");
    return;
  }

  if(!confirm('Delete #'+channel.name+' and all its messages?'))return;

  server.channels=server.channels.filter(c=>c.id!==channel.id);
  if(data.activeChannelId===channel.id)
    data.activeChannelId=server.channels[0].id;
  saveData();
  renderAll();
}

$("renameChannel").addEventListener("click",()=>{
  const channel=activeChannel();
  if(channel)renameChannel(channel);
});

$("deleteChannel").addEventListener("click",()=>{
  const channel=activeChannel();
  if(channel)removeChannel(channel);
});

$("chatForm").addEventListener("submit",event=>{
  event.preventDefault();
  const text=$("messageInput").value.trim();
  const channel=activeChannel();
  if(!text||!channel)return;

  const message={
    id:uid(),
    name:data.profile.name,
    color:data.profile.color,
    picture:data.profile.picture,
    time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),
    text,
    edited:false,
    owner:"local"
  };

  channel.messages.push(message);
  if(!saveData()){
    channel.messages.pop();
    return;
  }

  $("messageInput").value="";
  renderMessages();
});

function editMessage(channel,message){
  const next=prompt("Edit your message:",message.text);
  if(next===null)return;
  const text=next.trim();
  if(!text){alert("A message cannot be empty. Use Delete instead.");return;}
  if(text.length>2000){alert("Messages must be 2000 characters or fewer.");return;}

  const previous={text:message.text,edited:message.edited};
  message.text=text;
  message.edited=true;
  if(!saveData()){
    Object.assign(message,previous);
    return;
  }
  renderMessages();
}

function deleteMessage(channel,message){
  if(!confirm("Delete this message?"))return;
  const index=channel.messages.findIndex(m=>m.id===message.id);
  if(index<0)return;
  const removed=channel.messages.splice(index,1)[0];
  if(!saveData()){
    channel.messages.splice(index,0,removed);
    return;
  }
  renderMessages();
}

let pendingPicture="";
$("profileButton").addEventListener("click",()=>{
  $("usernameInput").value=data.profile.name;
  $("colorInput").value=data.profile.color;
  pendingPicture=data.profile.picture;
  $("avatarUpload").value="";
  avatar($("previewAvatar"),data.profile);
  $("profileOverlay").classList.add("open");
});

$("usernameInput").addEventListener("input",()=>{
  const person={
    name:$("usernameInput").value.trim()||"?",
    color:$("colorInput").value,
    picture:pendingPicture
  };
  avatar($("previewAvatar"),person);
});

$("colorInput").addEventListener("input",()=>{
  const person={
    name:$("usernameInput").value.trim()||"?",
    color:$("colorInput").value,
    picture:pendingPicture
  };
  avatar($("previewAvatar"),person);
});

$("avatarUpload").addEventListener("change",()=>{
  const file=$("avatarUpload").files[0];
  if(!file)return;
  if(!file.type.startsWith("image/")){
    alert("Choose an image file.");
    return;
  }
  if(file.size>1.5*1024*1024){
    alert("Choose an image smaller than 1.5 MB.");
    $("avatarUpload").value="";
    return;
  }

  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      const max=256;
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      canvas.width=Math.max(1,Math.round(img.width*scale));
      canvas.height=Math.max(1,Math.round(img.height*scale));
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      pendingPicture=canvas.toDataURL("image/jpeg",0.8);
      avatar($("previewAvatar"),{
        name:$("usernameInput").value.trim()||"?",
        color:$("colorInput").value,
        picture:pendingPicture
      });
    };
    img.onerror=()=>alert("Couldn't load that image.");
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});

$("removePicture").addEventListener("click",()=>{
  pendingPicture="";
  $("avatarUpload").value="";
  avatar($("previewAvatar"),{
    name:$("usernameInput").value.trim()||"?",
    color:$("colorInput").value,
    picture:""
  });
});

$("saveProfile").addEventListener("click",()=>{
  const name=cleanName($("usernameInput").value,24);
  if(!name){alert("Enter a username.");return;}

  const old={...data.profile};
  data.profile={
    name,
    color:$("colorInput").value,
    picture:pendingPicture
  };

  if(!saveData()){
    data.profile=old;
    return;
  }

  $("profileOverlay").classList.remove("open");
  renderAll();
});

document.querySelectorAll("[data-close]").forEach(button=>{
  button.addEventListener("click",()=>{
    $(button.dataset.close).classList.remove("open");
  });
});

document.querySelectorAll(".modal-overlay").forEach(overlay=>{
  overlay.addEventListener("click",event=>{
    if(event.target===overlay)overlay.classList.remove("open");
  });
});

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    document.querySelectorAll(".modal-overlay").forEach(m=>m.classList.remove("open"));
  }
});

$("voiceChannel").addEventListener("click",()=>{
  alert("Voice chat isn't available yet.");
});

loadData();
renderAll();
</script>
</body>
</html>
